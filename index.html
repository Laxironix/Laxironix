  /* ---------------------------------------------------------------

  function renderMarkdown(text) {
    if (!text) return '';
    var blocks = [];
    // Extract fenced code blocks
    var src = String(text).replace(/```(\w+)?\n?([\s\S]*?)```/g, function (m, lang, code) {
      var idx = blocks.length;
      blocks.push({ lang: (lang || 'code').toLowerCase(), code: code.replace(/^\n+|\n+$/g, '') });
      return '\u0000B' + idx + '\u0000';
    });

    src = escapeHtml(src);

    // Inline code
    src = src.replace(/`([^`\n]+)`/g, '<code class="lb-inline">$1</code>');
    // Bold
    src = src.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    // Italic
    src = src.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
    // Links
    src = src.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');

    // Lists (group consecutive <li> into <ul>)
    var lines = src.split('\n');
    var out = [];
    var inList = false;
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      var m = line.match(/^[ \t]*[-•]\s+(.+)$/);
      if (m) {
        if (!inList) { out.push('<ul>'); inList = true; }
        out.push('<li>' + m[1] + '</li>');
      } else {
        if (inList) { out.push('</ul>'); inList = false; }
        out.push(line);
      }
    }
    if (inList) out.push('</ul>');
    src = out.join('\n');
    // Collapse newlines around lists
    src = src.replace(/<\/li>\n/g, '</li>').replace(/<ul>\n/g, '<ul>').replace(/\n<\/ul>/g, '</ul>');
    // Line breaks
    src = src.replace(/\n/g, '<br>');

    // Restore code blocks
    src = src.replace(/\u0000B(\d+)\u0000/g, function (m, i) {
      var b = blocks[+i];
      return '<div class="lb-code">' +
        '<div class="lb-code-head">' +
          '<span class="lb-code-lang">' + escapeHtml(b.lang) + '</span>' +
          '<button class="lb-code-copy" type="button">Copy</button>' +
        '</div>' +
        '<pre><code>' + escapeHtml(b.code) + '</code></pre>' +
      '</div>';
    });

    return src;
  }

  /* ---------------------------------------------------------------
     MATH EVALUATOR (safe recursive descent)
     --------------------------------------------------------------- */
  var MATH_CONST = { pi: Math.PI, e: Math.E, tau: Math.PI * 2 };
  var MATH_FN = {
    sqrt: Math.sqrt, cbrt: Math.cbrt, abs: Math.abs,
    sin: Math.sin, cos: Math.cos, tan: Math.tan,
    asin: Math.asin, acos: Math.acos, atan: Math.atan,
    log: Math.log10, ln: Math.log, log2: Math.log2, exp: Math.exp,
    round: Math.round, floor: Math.floor, ceil: Math.ceil,
    min: Math.min, max: Math.max, pow: Math.pow, sign: Math.sign
  };

  function tokenizeMath(str) {
    var tokens = [], i = 0, c;
    while (i < str.length) {
      c = str[i];
      if (/\s/.test(c)) { i++; continue; }
      if (/[0-9]/.test(c) || (c === '.' && /[0-9]/.test(str[i + 1] || ''))) {
        var j = i;
        while (j < str.length && /[0-9.]/.test(str[j])) j++;
        var num = parseFloat(str.slice(i, j));
        if (isNaN(num)) throw new Error('Invalid number');
        tokens.push({ t: 'num', v: num });
        i = j; continue;
      }
      if (/[a-zA-Z_]/.test(c)) {
        var k = i;
        while (k < str.length && /[a-zA-Z0-9_]/.test(str[k])) k++;
        tokens.push({ t: 'id', v: str.slice(i, k).toLowerCase() });
        i = k; continue;
      }
      if ('+-*/%^(),'.indexOf(c) !== -1) {
        tokens.push({ t: 'p', v: c });
        i++; continue;
      }
      throw new Error('Unexpected character: ' + c);
    }
    return tokens;
  }

  function evalMath(input) {
    var tokens = tokenizeMath(input);
    var pos = 0;
    function peek() { return tokens[pos]; }
    function next() { return tokens[pos++]; }

    function parseExpr() {
      var left = parseTerm();
      while (peek() && (peek().v === '+' || peek().v === '-')) {
        var op = next().v;
        var right = parseTerm();
        left = op === '+' ? left + right : left - right;
      }
      return left;
    }
    function parseTerm() {
      var left = parsePower();
      while (peek() && (peek().v === '*' || peek().v === '/' || peek().v === '%')) {
        var op = next().v;
        var right = parsePower();
        if (op === '*') left *= right;
        else if (op === '/') { if (right === 0) throw new Error('Division by zero'); left /= right; }
        else left %= right;
      }
      return left;
    }
    function parsePower() {
      var base = parseUnary();
      if (peek() && peek().v === '^') { next(); return Math.pow(base, parsePower()); }
      return base;
    }
    function parseUnary() {
      if (peek() && peek().v === '-') { next(); return -parseUnary(); }
      if (peek() && peek().v === '+') { next(); return parseUnary(); }
      return parsePrimary();
    }
    function parsePrimary() {
      var tk = next();
      if (!tk) throw new Error('Unexpected end of expression');
      if (tk.t === 'num') return tk.v;
      if (tk.t === 'id') {
        if (peek() && peek().v === '(') {
          next();
          var args = [];
          if (peek() && peek().v !== ')') {
            args.push(parseExpr());
            while (peek() && peek().v === ',') { next(); args.push(parseExpr()); }
          }
          if (!peek() || peek().v !== ')') throw new Error('Missing )');
          next();
          var fn = MATH_FN[tk.v];
          if (!fn) throw new Error('Unknown function: ' + tk.v);
          return fn.apply(null, args);
        }
        if (MATH_CONST[tk.v] !== undefined) return MATH_CONST[tk.v];
        throw new Error('Unknown identifier: ' + tk.v);
      }
      if (tk.v === '(') {
        var val = parseExpr();
        if (!peek() || peek().v !== ')') throw new Error('Missing )');
        next();
        return val;
      }
      throw new Error('Unexpected token: ' + tk.v);
    }

    var result = parseExpr();
    if (pos < tokens.length) throw new Error('Unexpected token: ' + tokens[pos].v);
    if (!isFinite(result)) throw new Error('Result is not finite');
    return result;
  }

  /* ---------------------------------------------------------------
     INTENT DETECTION
     --------------------------------------------------------------- */
  function detectIntent(text) {
    var t = normalize(text);
    if (!t) return null;
    var best = { score: 0, intent: null };
    for (var i = 0; i < INTENTS.length; i++) {
      var intent = INTENTS[i];
      var score = 0;
      // Keyword hits
      for (var k = 0; k < intent.keywords.length; k++) {
        var kw = normalize(intent.keywords[k]);
        if (!kw) continue;
        if (t.indexOf(kw) !== -1) {
          // longer keyword matches weigh more
          score += kw.length >= 6 ? 3 : kw.length >= 3 ? 2 : 1;
        }
      }
      // Regex hits
      if (intent.patterns) {
        for (var p = 0; p < intent.patterns.length; p++) {
          if (intent.patterns[p].test(t)) score += 4;
        }
      }
      // Normalize by sqrt of keyword count to avoid huge intents dominating
      score = score / Math.sqrt(Math.max(1, intent.keywords.length));
      // Intent weight multiplier
      score *= (intent.weight || 1);
      if (score > best.score) best = { score: score, intent: intent };
    }
    // Minimum threshold
    return best.score >= 0.9 ? best.intent : null;
  }

  function replyIntent(id) {
    for (var i = 0; i < INTENTS.length; i++) {
      if (INTENTS[i].id === id) return INTENTS[i].reply();
    }
    return 'I don\'t have that info handy.';
  }

  function toolTokenomics(amount) {
    var n = Number(amount);
    if (!isFinite(n) || n <= 0) return null;
    var reserve = n * (LAX.split.reserve / 100);
    var community = n * (LAX.split.community / 100);
    return '**Tokenomics breakdown for ' + formatNum(n) + ' $LAX**\n\n' +
      '- **Founder / Project Reserve (50%)**: ' + formatNum(reserve) + ' $LAX\n' +
      '- **Community & Liquidity (50%)**: ' + formatNum(community) + ' $LAX\n\n' +
      'That\'s the 50 / 50 split applied to your amount.';
  }

  function toolPrice(tokens, price) {
    var t = Number(tokens), p = Number(price);
    if (!isFinite(t) || !isFinite(p)) return null;
    var total = t * p;
    return '**Value calculation**\n\n' +
      '- Tokens: **' + formatNum(t) + ' $LAX**\n' +
      '- Price: **$' + formatNum(p) + '** each\n' +
      '- Total value: **$' + formatNum(total) + '**\n\n' +
      '_This is a plain arithmetic result — not a price prediction or investment advice._';
  }

  function toolCalc(expr) {
    try {

      return '**' + escapeHtml(expr.trim()) + ' = ' + formatNum(r) + '**';

    }
  }

    }

    // price N P
    var priceMatch = text.match(/^price\s+([\d.,]+)\s+([\d.,]+)/i);
    if (priceMatch) {
      var tokens = parseFloat(priceMatch[1].replace(/,/g, ''));
      var price = parseFloat(priceMatch[2].replace(/,/g, ''));
      var pr = toolPrice(tokens, price);
      if (pr) return { text: pr, chips: ['Calculator', 'Tokenomics'] };
    }

    // Raw math (starts with number and contains operator)
    if (/^[\d.\s()+\-*/^%]+$/.test(text) && /[+\-*/^%]/.test(text)) {
      return { text: toolCalc(text), chips: ['Calculator', 'tokenomics 1000000'] };
    }

    // Intent detection
    var intent = detectIntent(text);
    if (intent) {
      return {
        text: intent.reply(),
        chips: intent.chips || ['Help', 'Tokenomics', 'How to buy', 'Code lab']
      };
    }

    // Fallback
    return {
      text: 'I\'m not sure I caught that. 🤔\n\nI\'m strongest on:\n' +
        '- **$LAX token info** — supply, allocation, chain\n' +
        '- **How to buy** on Solana\n' +
        '- **Wallet safety**\n' +
        '- **Code snippets** for Solana\n' +
        '- **Calculators** (math, tokenomics, price)\n\n' +
        'Try rephrasing, or type `/` to see all commands.',
      chips: ['Help', 'Tokenomics', 'How to buy', 'Code lab', 'Calculator', 'Safety']
    };
  }

  function handleCommand(text) {
    var parts = text.slice(1).trim().split(/\s+/);
    var cmd = '/' + (parts[0] || '').toLowerCase();
    var args = parts.slice(1);

    for (var i = 0; i < COMMANDS.length; i++) {
      if (COMMANDS[i].cmd === cmd) {
        var out = COMMANDS[i].run(args);
        if (out === null) return null; // handled internally (clear/export/theme/sound)
        return { text: out, chips: ['Help', 'Tokenomics', 'How to buy', 'Code lab'] };
      }
    }
    return {
      text: 'Unknown command `' + escapeHtml(cmd) + '`. Type `/` to open the palette, or `/help` for the list.',
      chips: ['/help', '/code', '/buy', '/clear']
    };
  }

  /* ---------------------------------------------------------------
     RENDERER
     --------------------------------------------------------------- */
  function addMessage(role, content, opts) {
    opts = opts || {};
    var msg = {
      id: uid(),
      role: role,
      content: content,
      ts: Date.now(),
      chips: opts.chips || null,
      typing: !!opts.typing
    };
    state.messages.push(msg);
    if (state.messages.length > CFG.maxHistory) state.messages.shift();
    renderMessage(msg);
    scrollToBottom();
    if (!state.open && role === 'bot') {
      state.unread++;
      updateBadge();
    }
    saveHistory();
    return msg;
  }

  function renderMessage(msg) {
    var wrap = document.createElement('div');
    wrap.className = 'lb-msg lb-' + msg.role;
    wrap.dataset.id = msg.id;

    var ava = document.createElement('div');
    ava.className = 'lb-msg-ava';
    if (msg.role === 'bot') {
      var img = document.createElement('img');
      img.src = $('lb-ava-img') ? $('lb-ava-img').src : CFG.fallbackLogo;
      img.alt = 'LAX';
      img.onerror = function () { this.src = CFG.fallbackLogo; };
      ava.appendChild(img);
    } else {
      ava.textContent = 'YOU';
    }

    var wrap2 = document.createElement('div');
    wrap2.className = 'lb-msg-wrap';

    var bubble = document.createElement('div');
    bubble.className = 'lb-bubble';

    if (msg.typing) {
      bubble.innerHTML = '<div class="lb-typing"><span></span><span></span><span></span></div>';
    } else {
      bubble.innerHTML = renderMarkdown(msg.content);
    }
    wrap2.appendChild(bubble);

    // Meta row
    if (!msg.typing) {
      var meta = document.createElement('div');
      meta.className = 'lb-meta';
      var t = document.createElement('span');
      t.textContent = timeLabel(msg.ts);
      meta.appendChild(t);
      var copyBtn = document.createElement('button');
      copyBtn.type = 'button';
      copyBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy';
      copyBtn.addEventListener('click', function () {
        copyText(msg.content).then(function () {
          copyBtn.innerHTML = 'Copied';
          setTimeout(function () {
            copyBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy';
          }, 1200);
        });
      });
      meta.appendChild(copyBtn);
      wrap2.appendChild(meta);
    }

    wrap.appendChild(ava);
    wrap.appendChild(wrap2);
    elBody.appendChild(wrap);

    // Wire up code-copy buttons inside this bubble
    bubble.querySelectorAll('.lb-code-copy').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var codeEl = btn.closest('.lb-code').querySelector('pre code');
        if (!codeEl) return;
        copyText(codeEl.textContent).then(function () {
          btn.textContent = 'Copied';
          btn.classList.add('lb-copied');
          setTimeout(function () {
            btn.textContent = 'Copy';
            btn.classList.remove('lb-copied');
          }, 1300);
        });
      });
    });
  }

  function replaceTyping(msgId, content, chips) {
    var node = elBody.querySelector('[data-id="' + msgId + '"]');
    if (!node) return;
    var msg = state.messages.find(function (m) { return m.id === msgId; });
    if (msg) {
      msg.typing = false;
      msg.content = content;
      msg.chips = chips || null;
      msg.ts = Date.now();
    }
    var bubble = node.querySelector('.lb-bubble');
    if (bubble) {
      bubble.innerHTML = renderMarkdown(content);
      // wire code copy
      bubble.querySelectorAll('.lb-code-copy').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var codeEl = btn.closest('.lb-code').querySelector('pre code');
          if (!codeEl) return;
          copyText(codeEl.textContent).then(function () {
            btn.textContent = 'Copied';
            btn.classList.add('lb-copied');
            setTimeout(function () {
              btn.textContent = 'Copy';
              btn.classList.remove('lb-copied');
            }, 1300);
          });
        });
      });
    }
    // meta row
    var wrap2 = node.querySelector('.lb-msg-wrap');
    var oldMeta = wrap2.querySelector('.lb-meta');
    if (oldMeta) oldMeta.remove();
    var meta = document.createElement('div');
    meta.className = 'lb-meta';
    var t = document.createElement('span');
    t.textContent = timeLabel(Date.now());
    meta.appendChild(t);
    var copyBtn = document.createElement('button');
    copyBtn.type = 'button';
    copyBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy';
    copyBtn.addEventListener('click', function () {
      copyText(content).then(function () {
        copyBtn.innerHTML = 'Copied';
        setTimeout(function () {
          copyBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy';
        }, 1200);
      });
    });
    meta.appendChild(copyBtn);
    wrap2.appendChild(meta);

    if (chips && chips.length) renderChips(chips);
    scrollToBottom();
    saveHistory();
  }

  function renderChips(chips) {
    elChips.innerHTML = '';
    if (!chips || !chips.length) return;
    chips.slice(0, 6).forEach(function (c) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'lb-chip';
      // If it's a command, add a small icon
      var iconSvg = '';
      if (c.charAt(0) === '/') {
        iconSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-6-6-6M12 19h8"/></svg>';
      }
      btn.innerHTML = iconSvg + '<span>' + escapeHtml(c) + '</span>';
      btn.addEventListener('click', function () {
        sendUserMessage(c);
      });
      elChips.appendChild(btn);
    });
  }

  function scrollToBottom() {
    requestAnimationFrame(function () {
      elBody.scrollTop = elBody.scrollHeight;
    });
  }

  /* ---------------------------------------------------------------
     SEND FLOW
     --------------------------------------------------------------- */
  function sendUserMessage(text) {
    text = String(text || '').trim();
    if (!text || state.waiting) return;
    addMessage('user', text);
    elInput.value = '';
    autoResize();
    elSend.disabled = true;
    playBeep(660, 0.05);

    // Typing indicator
    var typingMsg = addMessage('bot', '', { typing: true });
    state.waiting = true;
    setStatus('Thinking…');

    var response = respondTo(text);
    var delay = response ? Math.min(1500, 320 + response.text.length * 1.8) : 500;

    setTimeout(function () {
      state.waiting = false;
      setStatus('Online · Ready to help');
      if (!response) {
        // clear/export/theme/sound commands
        var node = elBody.querySelector('[data-id="' + typingMsg.id + '"]');
        if (node) node.remove();
        state.messages = state.messages.filter(function (m) { return m.id !== typingMsg.id; });
        return;
      }
      replaceTyping(typingMsg.id, response.text, response.chips);
      playBeep(880, 0.06);
    }, delay);
  }

  /* ---------------------------------------------------------------
     STATUS / BADGE
     --------------------------------------------------------------- */
  function setStatus(text) {
    if (elStatusText) elStatusText.textContent = text;
  }
  function updateBadge() {
    if (!elBadge) return;
    if (state.unread > 0) {
      elBadge.textContent = state.unread > 9 ? '9+' : String(state.unread);
      elBadge.classList.remove('lb-hide');
    } else {
      elBadge.classList.add('lb-hide');
    }
  }

  /* ---------------------------------------------------------------
     SOUND
     --------------------------------------------------------------- */
  var audioCtx = null;
  function playBeep(freq, dur) {
    if (!state.sound) return;
    try {
      if (!audioCtx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();
      }
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.06, audioCtx.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      o.connect(g).connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + dur + 0.02);
    } catch (e) { /* noop */ }
  }

  function toggleSound() {
    state.sound = !state.sound;
    var btn = $('lb-btn-sound');
    btn.classList.toggle('lb-active', state.sound);
    savePrefs();
    showToast(state.sound ? 'Sound on' : 'Sound off');
    if (state.sound) playBeep(880, 0.08);
  }

  /* ---------------------------------------------------------------
     EXPORT / CLEAR
     --------------------------------------------------------------- */
  function exportChat() {
    var txt = state.messages.map(function (m) {
      var who = m.role === 'user' ? 'You' : 'LAX Assistant';
      return '[' + new Date(m.ts).toLocaleString() + '] ' + who + ':\n' + m.content + '\n';
    }).join('\n---\n\n');
    try {
      var blob = new Blob([txt], { type: 'text/plain' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'lax-assistant-chat-' + Date.now() + '.txt';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      showToast('Chat exported');
    } catch (e) {
      showToast('Export failed');
    }
  }

  function clearChat() {
    state.messages = [];
    elBody.innerHTML = '';
    elChips.innerHTML = '';
    localStorage.removeItem(CFG.storageKey);
    renderWelcome();
    showToast('Conversation cleared');
  }

  /* ---------------------------------------------------------------
     PERSISTENCE
     --------------------------------------------------------------- */
  function saveHistory() {
    try {
      var toSave = state.messages.filter(function (m) { return !m.typing; }).slice(-CFG.maxHistory);
      localStorage.setItem(CFG.storageKey, JSON.stringify(toSave));
    } catch (e) { /* ignore */ }
  }
  function loadHistory() {
    try {
      var raw = localStorage.getItem(CFG.storageKey);
      if (!raw) return null;
      var arr = JSON.parse(raw);
      if (!Array.isArray(arr)) return null;
      return arr.filter(function (m) { return m && m.role && typeof m.content === 'string'; });
    } catch (e) { return null; }
  }
  function savePrefs() {
    try {
      localStorage.setItem(CFG.prefsKey, JSON.stringify({ sound: state.sound }));
    } catch (e) { /* ignore */ }
  }
  function loadPrefs() {
    try {
      var raw = localStorage.getItem(CFG.prefsKey);
      if (!raw) return;
      var p = JSON.parse(raw);
      if (p && typeof p.sound === 'boolean') state.sound = p.sound;
    } catch (e) { /* ignore */ }
  }

  /* ---------------------------------------------------------------
     COMMAND PALETTE
     --------------------------------------------------------------- */
  function renderPalette(filter) {
    var f = (filter || '').toLowerCase().replace(/^\//, '');
    var items = COMMANDS.filter(function (c) {
      if (!f) return true;
      return c.cmd.toLowerCase().indexOf(f) !== -1 || c.desc.toLowerCase().indexOf(f) !== -1;
    });
    elPaletteList.innerHTML = '';
    if (!items.length) {
      elPaletteList.innerHTML = '<div class="lb-palette-empty">No matching commands</div>';
      return;
    }
    items.forEach(function (c, i) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'lb-palette-item' + (i === state.paletteSel ? ' lb-sel' : '');
      btn.innerHTML =
        '<span class="lb-pi-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + (ICONS[c.icon] || ICONS.bolt) + '</svg></span>' +
        '<span><span class="lb-pi-cmd">' + escapeHtml(c.cmd) + '</span><span class="lb-pi-desc">' + escapeHtml(c.desc) + '</span></span>';
      btn.addEventListener('click', function () {
        togglePalette(false);
        sendUserMessage(c.cmd);
      });
      elPaletteList.appendChild(btn);
    });
    state.paletteSel = 0;
  }

  function togglePalette(open) {
    state.palette = open !== undefined ? open : !state.palette;
    elPalette.classList.toggle('lb-open', state.palette);
    if (state.palette) {
      elPaletteInput.value = '';
      renderPalette('');
      setTimeout(function () { elPaletteInput.focus(); }, 60);
    }
  }

  function toggleSidebar(open) {
    state.sidebar = open !== undefined ? open : !state.sidebar;
    elSidebar.classList.toggle('lb-open', state.sidebar);
    $('lb-btn-sidebar').classList.toggle('lb-active', state.sidebar);
  }

  /* ---------------------------------------------------------------
     OPEN / CLOSE
     --------------------------------------------------------------- */
  function setOpen(open) {
    state.open = open;
    elPanel.classList.toggle('lb-open', open);
    elFab.classList.toggle('lb-open', open);
    if (open) {
      state.unread = 0;
      updateBadge();
      setTimeout(function () { elInput.focus(); }, 260);
    }
  }

  /* ---------------------------------------------------------------
     INPUT HANDLING
     --------------------------------------------------------------- */
  function autoResize() {
    elInput.style.height = 'auto';
    elInput.style.height = Math.min(elInput.scrollHeight, 120) + 'px';
    elSend.disabled = elInput.value.trim().length === 0 || state.waiting;
  }

  /* ---------------------------------------------------------------
     VOICE INPUT
     --------------------------------------------------------------- */
  function initVoice() {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      elMic.style.display = 'none';
      return;
    }
    state.recognition = new SR();
    state.recognition.lang = 'en-US';
    state.recognition.interimResults = false;
    state.recognition.maxAlternatives = 1;

    state.recognition.onstart = function () {
      state.listening = true;
      elMic.classList.add('lb-listening');
      setStatus('Listening…');
    };
    state.recognition.onend = function () {
      state.listening = false;
      elMic.classList.remove('lb-listening');
      setStatus('Online · Ready to help');
    };
    state.recognition.onerror = function (e) {
      state.listening = false;
      elMic.classList.remove('lb-listening');
      setStatus('Online · Ready to help');
      if (e.error !== 'aborted') showToast('Voice error: ' + e.error);
    };
    state.recognition.onresult = function (ev) {
      var text = ev.results[0][0].transcript;
      elInput.value = text;
      autoResize();
      setTimeout(function () { sendUserMessage(text); }, 180);
    };
  }

  /* ---------------------------------------------------------------
     INIT
     --------------------------------------------------------------- */
  function init() {
    elPanel = $('lb-panel');
    elFab = $('lb-fab');
    elBody = $('lb-body');
    elInput = $('lb-input');
    elSend = $('lb-btn-send');
    elMic = $('lb-btn-mic');
    elChips = $('lb-chips');
    elSidebar = $('lb-sidebar');
    elPalette = $('lb-palette');
    elPaletteInput = $('lb-palette-input');
    elPaletteList = $('lb-palette-list');
    elToast = $('lb-toast');
    elToastMsg = $('lb-toast-msg');
    elBadge = $('lb-badge');
    elStatusText = $('lb-status-text');
    elHintRight = $('lb-hint-right');

    if (!elPanel) return;

    // Fallback logo
    var avaImg = $('lb-ava-img');
    if (avaImg) avaImg.onerror = function () { this.onerror = null; this.src = CFG.fallbackLogo; };

    // Load prefs
    loadPrefs();
    if (state.sound) $('lb-btn-sound').classList.add('lb-active');

    // Version
    elHintRight.textContent = 'v2.0';

    // Render services sidebar
    renderServicesSidebar();

    // Load or welcome
    var history = loadHistory();
    if (history && history.length) {
      history.forEach(function (m) {
        state.messages.push(m);
        renderMessage(m);
      });
      scrollToBottom();
      // Render last known chips from last bot message
      var lastBot = null;
      for (var i = state.messages.length - 1; i >= 0; i--) {
        if (state.messages[i].role === 'bot' && state.messages[i].chips) {
          lastBot = state.messages[i]; break;
        }
      }
      if (lastBot) renderChips(lastBot.chips);
    } else {
      renderWelcome();
    }

    // FAB
    elFab.addEventListener('click', function () {
      setOpen(!state.open);
    });

    // Close button
    $('lb-btn-close').addEventListener('click', function () { setOpen(false); });

    // Sidebar
    $('lb-btn-sidebar').addEventListener('click', function () { toggleSidebar(); });
    $('lb-sidebar-close').addEventListener('click', function () { toggleSidebar(false); });

    // Palette
    $('lb-btn-palette').addEventListener('click', function () { togglePalette(); });
    elPalette.addEventListener('click', function (e) {
      if (e.target === elPalette) togglePalette(false);
    });
    elPaletteInput.addEventListener('input', function () {
      renderPalette(elPaletteInput.value);
    });
    elPaletteInput.addEventListener('keydown', function (e) {
      var items = elPaletteList.querySelectorAll('.lb-palette-item');
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        state.paletteSel = Math.min(state.paletteSel + 1, items.length - 1);
        items.forEach(function (it, i) { it.classList.toggle('lb-sel', i === state.paletteSel); });
        if (items[state.paletteSel]) items[state.paletteSel].scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        state.paletteSel = Math.max(state.paletteSel - 1, 0);
        items.forEach(function (it, i) { it.classList.toggle('lb-sel', i === state.paletteSel); });
        if (items[state.paletteSel]) items[state.paletteSel].scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (items[state.paletteSel]) items[state.paletteSel].click();
      } else if (e.key === 'Escape') {
        togglePalette(false);
      }
    });

    // Sound
    $('lb-btn-sound').addEventListener('click', toggleSound);

    // Send
    elSend.addEventListener('click', function () { sendUserMessage(elInput.value); });

    // Input
    elInput.addEventListener('input', autoResize);
    elInput.addEventListener('focus', function () { $('lb-input-row').classList.add('lb-focus'); });
    elInput.addEventListener('blur', function () { $('lb-input-row').classList.remove('lb-focus'); });
    elInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendUserMessage(elInput.value);
      }
      // "/" opens palette when empty
      if (e.key === '/' && elInput.value === '') {
        e.preventDefault();
        togglePalette(true);
      }
      if (e.key === 'Escape') {
        if (state.palette) togglePalette(false);
        else if (state.sidebar) toggleSidebar(false);
        else setOpen(false);
      }
    });

    // Mic
    initVoice();
    if (state.recognition) {
      elMic.addEventListener('click', function () {
        if (state.listening) state.recognition.stop();
        else { try { state.recognition.start(); } catch (e) {} }
      });
    }

    // Global Esc
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        if (state.palette) togglePalette(false);
        else if (state.sidebar) toggleSidebar(false);
      }
    });

    autoResize();

    // Auto-open on first visit after a short delay
    try {
      if (!localStorage.getItem(CFG.storageKey)) {
        setTimeout(function () {
          if (!state.open) {
            // gently pulse the FAB instead of forcing open
            elFab.style.animation = 'lb-pulse 1.6s ease-in-out 2';
            setTimeout(function () { elFab.style.animation = ''; }, 3400);
          }
        }, 2400);
      }
    } catch (e) {}
  }

  /* ---------------------------------------------------------------
     BOOT
     --------------------------------------------------------------- */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
